name: mapstructure

env:
  GITHUB_TOKEN: ${{ secrets.GANDALF_GITHUB_TOKEN }}

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: '0 4 1 * *'


jobs:
  build:
    uses: whitehatsec/pipelines-library/.github/workflows/go-module.yaml@main
    secrets: inherit
    with:
      service_name: ${{ github.workflow }}
    

